name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Dependencies
        run: cd server && npm install
      - name: Run Tests
        run: cd server && npm test || echo "No tests yet"
      - name: Deploy to Render
        run: curl -X POST https://api.render.com/deploy/srv-XXXXX?key=YYYYY
